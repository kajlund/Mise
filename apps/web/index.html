<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f6f2e9" />
    <meta
      name="description"
      content="Mise — a calm home for recipes, ingredients and instructions"
    />
    <meta name="application-name" content="Mise" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/mise-icon-192.png" />
    <title>Mise — Recipe Manager</title>
    <script>
      (function () {
        try {
          const saved = localStorage.getItem('mise-theme');
          const prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches;
          const theme =
            saved === 'dark' || (!saved && prefersDark) ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta)
            meta.setAttribute(
              'content',
              theme === 'dark' ? '#151412' : '#f6f2e9',
            );
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <mise-app></mise-app>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
