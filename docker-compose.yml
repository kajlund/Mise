services:
  mise:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mise-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/mise
      - WEB_ORIGIN=http://localhost:3000
      - LOG_LEVEL=info
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    container_name: mise-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongo_data:
